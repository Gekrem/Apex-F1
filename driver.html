"],"style":"Tek turda yüksek hız, hassas frenaj ve analitik yaklaşım."},"lewis-hamilton":{"wiki":"Lewis_Hamilton","number":"44","born":"7 Ocak 1985","place":"Stevenage, İngiltere","debut":"2007 — Avustralya GP","bio":"Karting kariyerinde McLaren ve Mercedes'in desteğini alan Hamilton, 2007'de Formula 1'e olağanüstü bir başlangıç yaptı. Rekorlarla dolu kariyeri, pist üstündeki başarısının yanı sıra çeşitlilik ve sosyal sorumluluk çalışmalarıyla da öne çıkıyor.","milestones":["2008'de ilk Dünya Şampiyonluğunu kazandı.","Mercedes ile 2014–2020 arasında altı şampiyonluk daha elde etti.","Michael Schumacher ile yedi dünya şampiyonluğu rekorunu paylaşıyor.","Formula 1 tarihinde 100'den fazla yarış galibiyetine ulaşan ilk pilot oldu."],"style":"Yarış zekâsı, değişken koşullarda hız ve lastik koruma."},"charles-leclerc":{"wiki":"Charles_Leclerc","number":"16","born":"16 Ekim 1997","place":"Monte Carlo, Monako","debut":"2018 — Avustralya GP","bio":"Monako'da büyüyen Leclerc, çocukluk arkadaşı Jules Bianchi'nin desteğiyle yarış kariyerine yöneldi. Ferrari Sürücü Akademisi'ne katıldıktan sonra Formula 2 şampiyonluğunu kazandı ve kısa sürede Ferrari'nin lider pilotlarından biri oldu.","milestones":["2016 GP3 Series şampiyonu oldu.","2017 Formula 2 şampiyonluğunu kazandı.","2019 Belçika ve İtalya GP'lerinde ilk galibiyetlerini aldı.","Ferrari ile çok sayıda pole pozisyonu elde etti."],"style":"Tek tur hızı, geç frenaj ve hassas araç yerleşimi."},"lando-norris":{"wiki":"Lando_Norris","number":"1","born":"13 Kasım 1999","place":"Bristol, İngiltere","debut":"2019 — Avustralya GP","bio":"Norris, kartingde uluslararası başarılar kazandıktan sonra Avrupa Formula 3 ve Formula 2'de yükseldi. McLaren ile Formula 1'e adım attı; hızlı adaptasyonu, doğal hızı ve takım içindeki iletişimiyle öne çıktı.","milestones":["2016 MSA Formula şampiyonu oldu.","2017 Avrupa Formula 3 şampiyonluğunu kazandı.","2020 Avusturya GP'de ilk podyumuna çıktı.","2024 Miami GP'de ilk Formula 1 galibiyetini aldı."],"style":"Yüksek tek tur temposu, akıcı sürüş ve güçlü yarış temposu."},"oscar-piastri":{"wiki":"Oscar_Piastri","number":"81","born":"6 Nisan 2001","place":"Melbourne, Avustralya","debut":"2023 — Bahreyn GP","bio":"Piastri, genç kategorilerde arka arkaya şampiyonluklar kazanarak dikkat çekti. Formula Renault Eurocup, Formula 3 ve Formula 2'deki başarılarının ardından McLaren ile Formula 1'e geçti.","milestones":["2019 Formula Renault Eurocup şampiyonu oldu.","2020 FIA Formula 3 şampiyonluğunu kazandı.","2021 Formula 2 şampiyonu olarak çaylak sezonunu tamamladı.","2024 Macaristan ve Azerbaycan GP'lerinde ilk galibiyetlerini aldı."],"style":"Soğukkanlılık, lastik yönetimi ve temiz savunma."},"isack-hadjar":{"wiki":"Isack_Hadjar","number":"6","born":"28 Eylül 2004","place":"Paris, Fransa","debut":"2025 — Avustralya GP","bio":"Cezayir kökenli Fransız pilot Hadjar, kartingden sonra Fransız ve Avrupa tek koltuklu serilerinde yükseldi. Red Bull genç pilot programında gelişimini sürdürerek Formula 1'e ulaştı.","milestones":["2022 Formula Regional Avrupa'da yarış galibiyetleri aldı.","2023 ve 2024 Formula 2 sezonlarında şampiyonluk mücadelesi verdi.","2025'te Racing Bulls ile Formula 1'e çıktı.","Red Bull'un genç pilot programından ana takıma yükseldi."],"style":"Atak sürüş, güçlü sıralama turları ve rekabetçi refleksler."},"liam-lawson":{"wiki":"Liam_Lawson","number":"30","born":"11 Şubat 2002","place":"Hastings, Yeni Zelanda","debut":"2023 — Hollanda GP","bio":"Yeni Zelanda'dan çıkan Lawson, Toyota Racing Series ve FIA Formula 3'teki performansıyla Red Bull'un genç pilot programına katıldı. Super Formula tecrübesi de kazandıktan sonra Formula 1'de fırsat buldu.","milestones":["2021 DTM sezonunu ikinci sırada tamamladı.","2023 Super Formula'da şampiyonluk mücadelesi verdi.","2023 Hollanda GP'de sakatlanan Daniel Ricciardo'nun yerine F1'e çıktı.","2023 Singapur GP'de ilk puanlarını kazandı."],"style":"Cesur ataklar, hızlı adaptasyon ve mücadeleci karakter."},"pierre-gasly": udi Arabistan GP","bio":"Bearman, Ferrari Sürücü Akademisi'nde yetişti ve Formula 3 ile Formula 2'de yarıştı. Carlos Sainz'ın sağlık sorunu nedeniyle 2024 Suudi Arabistan GP'de Ferrari koltuğuna geçerek dikkat çekici bir Formula 1 debutu yaptı.","milestones":["2021 İtalya ve ADAC Formula 4 şampiyonluklarını kazandı.","2022'de Ferrari Sürücü Akademisi'ne katıldı.","2024 Suudi Arabistan GP'de Ferrari ile yedinci oldu.","2024 Azerbaycan GP'de Haas ile puan aldı."],"style":"Soğukkanlılık, hızlı öğrenme ve yarış içi karar kalitesi."},"gabriel-bortoleto":{"wiki":"Gabriel_Bortoleto","number":"5","born":"14 Ekim 2004","place":"São Paulo, Brezilya","debut":"2025 — Avustralya GP","bio":"Brezilyalı Bortoleto, Avrupa'ya geçerek tek koltuklu serilerde yükseldi. Formula 3 ve Formula 2 şampiyonluklarını arka arkaya kazanması, onu son dönemin en dikkat çekici genç yeteneklerinden biri yaptı.","milestones":["2023 FIA Formula 3 şampiyonu oldu.","2024 FIA Formula 2 şampiyonluğunu kazandı.","Fernando Alonso'nun A14 yönetimiyle temsil edildi.","2025'te Formula 1'e yükseldi."],"style":"Temiz yarış çizgisi, istikrar ve güçlü sıralama performansı."},"nico-hulkenberg":{"wiki":"Nico_Hulkenberg","number":"27","born":"19 Ağustos 1987","place":"Emmerich am Rhein, Almanya","debut":"2010 — Bahreyn GP","bio":"Hülkenberg, Formula BMW, A1GP, GP2 ve Formula 3 kategorilerindeki başarılarının ardından Formula 1'e geldi. Uzun kariyeri boyunca farklı takımlarda yarıştı; dayanıklılık yarışlarında da önemli başarılar elde etti.","milestones":["2009 GP2 şampiyonluğunu kazandı.","2015 Le Mans 24 Saat yarışını Porsche ile kazandı.","2010 Brezilya GP'de kariyerinin ilk pole pozisyonunu aldı.","2024'te uzun aranın ardından tekrar tam zamanlı F1 koltuğuna döndü."],"style":"Tek turda güçlü performans, teknik hassasiyet ve tecrübe."},"esteban-ocon":{"wiki":"Esteban_Ocon","number":"31","born":"17 Eylül 1996","place":"Évreux, Fransa","debut":"2016 — Belçika GP","bio":"Ocon'un ailesi, kariyerini destekleyebilmek için evlerini ve işlerini geride bırakarak motor sporlarına odaklandı. Fransız pilot, genç kategorilerde şampiyonluklar kazanıp Mercedes genç pilot programına girdi.","milestones":["2014 FIA Formula 3 Avrupa şampiyonu oldu.","2015 GP3 Series şampiyonluğunu kazandı.","2021 Macaristan GP'de ilk Formula 1 galibiyetini aldı.","2020 Sakhir GP'de ilk podyumuna çıktı."],"style":"Savunma becerisi, mücadelecilik ve değişken koşullarda dayanıklılık."},"fernando-alonso":{"wiki":"Fernando_Alonso","number":"14","born":"29 Temmuz 1981","place":"Oviedo, İspanya","debut":"2001 — Avustralya GP","bio":"Alonso, kartinge küçük yaşta başladı ve Minardi ile Formula 1'e yükseldi. Renault döneminde iki dünya şampiyonluğu kazandı. Formula 1 dışında Le Mans 24 Saat ve Dünya Dayanıklılık Şampiyonası gibi serilerde de başarı elde etti.","milestones":["2005 ve 2006 Formula 1 Dünya Şampiyonu oldu.","2018 ve 2019 Le Mans 24 Saat yarışlarını kazandı.","2021'de Formula 1'e geri döndü.","2023'te Aston Martin ile çok sayıda podyum elde etti."],"style":"Yarış zekâsı, savunma, stratejik sezgi ve tecrübe."},"carlos-sainz":{"wiki":"Carlos_Sainz_Jr.","number":"55","born":"1 Eylül 1994","place":"Madrid, İspanya","debut":"2015 — Avustralya GP","bio":"Ralli efsanesi Carlos Sainz'ın oğlu olan İspanyol pilot, Red Bull genç programından Formula 1'e yükseldi. Toro Rosso, Renault, McLaren ve Ferrari deneyimlerinin ardından Williams'a geçti.","milestones":["2015'te Toro Rosso ile Formula 1 debutunu yaptı.","2019 Brezilya GP'de ilk podyumunu aldı.","2022 Britanya GP'de ilk Formula 1 galibiyetini kazandı.","Ferrari ile 2023 Singapur GP dahil yarış zaferleri elde etti."],"style":"Yarış temposu, lastik yönetimi ve mühendislik geri bildirimi."},"alexander-albon":{"wiki":"Alexander_Albon","number":"23","born":"23 Mart 1996","place":"Londra, İngiltere","debut":"2019 — Avustralya GP","bio":"Taylandlı-Britanyalı Albon, karting ve genç kategorilerde ilerleyerek Formula 1'e ulaştı. Red Bull döneminden sonra Williams'a geçti ve takımın yeniden yapılanma sürecinde önemli rol üstlendi.","milestones":["2018 Formula 2 sezonunu üçüncü tamamladı.","2019'da Toro Rosso ile F1'e yükseldi.","2020 Mugello ve Bahreyn yarışlarında podyuma çıktı.","2022'de Williams'a katıldı."],"style":"Lastik koruma, sakin yarış yönetimi ve istikrarlı gelişim."},"yuki-tsunoda":{"wiki":"Yuki_Tsunoda","number":"22","born":"11 Mayıs 2000","place":"Sagamihara, Japonya","debut":"2021 — Bahreyn GP","bio":"Honda destekli genç pilot programından yetişen Tsunoda, Formula 2'deki başarılı sezonunun ardından AlphaTauri ile Formula 1'e yükseldi. Hızlı karakteri ve doğrudan iletişim tarzıyla tanınıyor.","milestones":["2018 Japonya F4 şampiyonluğunu kazandı.","2020 Formula 2 sezonunu üçüncü tamamladı.","2021 Bahreyn GP'de Formula 1 debutunu yaptı.","2021 Abu Dhabi GP'de kariyerinin en iyi sonucunu o dönem için aldı."],"style":"Hızlı tur temposu, atak sürüş ve güçlü refleksler."},"ryo-hirakawa":{"wiki":"Ryo_Hirakawa","number":"50","born":"7 Mart 1994","place":"Kure, Japonya","debut":"Formula 1 yarış debutu: sezon kaydına göre 2026","bio":"Hirakawa, Japonya Super GT ve Super Formula sahnesinde yetişti; dayanıklılık yarışlarında Toyota ile büyük başarılar kazandı. Formula 1'e geçişi, uzun yıllara yayılan spor otomobil ve tek koltuklu tecrübesinin ardından geldi.","milestones":["2022 Le Mans 24 Saat yarışını Toyota ile kazandı.","2022 FIA Dünya Dayanıklılık Şampiyonası'nı kazanan Toyota ekibinin parçasıydı.","2024'te Formula 1 serbest antrenman seansına çıktı.","Toyota'nın Formula 1 test ve geliştirme çalışmalarında görev aldı."],"style":"Teknik tutarlılık, dayanıklılık temposu ve araç geliştirme deneyimi."},"lance-stroll":{"wiki":"Lance_Stroll","number":"18","born":"29 Ekim 1998","place":"Montreal, Kanada","debut":"2017 — Avustralya GP","bio":"Stroll, kartingden sonra Avrupa Formula 3'te şampiyonluk kazandı ve Williams ile Formula 1'e geçti. Genç yaşta podyum ve pole pozisyonu elde ederek kariyerinin ilk döneminde önemli sonuçlar aldı.","milestones":["2016 Avrupa Formula 3 şampiyonu oldu.","2017 Azerbaycan GP'de ilk podyumunu aldı.","2017 İtalya GP'de ön sıradan start aldı.","2020 Türkiye GP'de kariyerinin ilk pole pozisyonunu kazandı."],"style":"Islak zeminde hız ve güçlü sıralama turları."},"valtteri-bottas":{"wiki":"Valtteri_Bottas","number":"77","born":"28 Ağustos 1989","place":"Nastola, Finlandiya","debut":"2013 — Avustralya GP","bio":"Bottas, Williams ile Formula 1'e yükseldi ve Mercedes döneminde takımın şampiyonluk mücadelesine önemli katkı verdi. Kariyeri boyunca sıralama turlarındaki hızı ve takım oyunculuğuyla tanındı.","milestones":["2013'te Williams ile Formula 1 debutunu yaptı.","2017'de Mercedes'e katıldı ve ilk galibiyetini Rusya'da aldı.","2019 ve 2020'de pilotlar şampiyonasını ikinci tamamladı.","Formula 1'de 10 yarış galibiyeti elde etti."],"style":"Tek tur hızı, temiz yarış çizgisi ve takım odaklı yaklaşım."},"sergio-perez":{"wiki":"Sergio_Perez","number":"11","born":"26 Ocak 1990","place":"Guadalajara, Meksika","debut":"2011 — Avustralya GP","bio":"Perez, genç yaşta Avrupa'ya giderek tek koltuklu serilerde yarıştı. Sauber'deki etkileyici lastik yönetimiyle dikkat çekti; Force India, Racing Point ve Red Bull dönemlerinde yarış galibiyetleri kazandı.","milestones":["2012 Malezya GP'de Sauber ile podyuma çıktı.","2020 Sakhir GP'de ilk Formula 1 galibiyetini aldı.","Red Bull ile 2022 Monako ve 2023 Suudi Arabistan GP'lerini kazandı.","2023 pilotlar şampiyonasını ikinci tamamladı."],"style":"Lastik yönetimi, stratejik yarış temposu ve geç ataklar."},"rafael-camara":{"wiki":"Rafael_Camara","number":"","born":"5 Mayıs 2005","place":"Recife, Brezilya","debut":"2026 sezon kaydı — Haas","bio":"Brezilyalı Camara, kartingden sonra Ferrari Sürücü Akademisi'ne katıldı ve Avrupa'nın genç formül serilerinde yükseldi. Formula 3 ve Formula 2 basamaklarındaki performansıyla dikkat çekti. APEX F1'in 2026 sezon verisinde Haas pilotu olarak listeleniyor.","milestones":["Ferrari Sürücü Akademisi'ne katıldı.","2024 Formula Regional Avrupa şampiyonluğunu kazandı.","2025 FIA Formula 3 şampiyonu oldu.","2026 sezon verisinde Haas adına yarış kaydı bulunuyor."],"style":"Teknik hassasiyet, tek tur hızı ve genç yaşına rağmen güçlü yarış disiplini."}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const params=new URLSearchParams(location.search),id=params.get('driver')||params.get('id')||'';
const app=document.getElementById('app');
function showError(){app.innerHTML='<div class="error"><div class="eyebrow">THE GRID / DRIVER PROFILE</div><h1>Pilot bulunamadı</h1><p>Bu bağlantıdaki pilot profili bulunamadı. Pilot kadrosuna dönüp başka bir isim seçebilirsin.</p><a class="back" href="index.html#standings">← Pilot kadrosuna dön</a></div>'}
async function load(){
 try{
  const [seasonResponse]=await Promise.all([fetch('data/season-2026.json',{cache:'no-store'})]);
  if(!seasonResponse.ok)throw Error('season data');
  const season=await seasonResponse.json();
  const driver=season.drivers.find(d=>slug(d.name)===id);
  const profile=profiles[id];
  if(!driver||!profile){showError();return}
  const team=season.teams.find(t=>t.name===driver.team);
  document.title=driver.name+' — Pilot Profili | APEX F1';
  const others=season.drivers.filter(d=>d.name!==driver.name).slice(0,8);
  app.innerHTML='<div class="eyebrow">THE GRID / DRIVER PROFILE · 2026 SEASON</div><section class="hero"><div class="portrait"><div class="initials">'+esc(driver.name.split(' ').map(x=>x[0]).slice(0,2).join(''))+'</div><img id="driverPhoto" alt="'+esc(driver.name)+' portre fotoğrafı"><div class="credit" id="photoCredit">Portre görseli yükleniyor…</div></div><div class="identity"><div class="team">'+esc(driver.team)+'</div><h1>'+esc(driver.name)+'</h1><p class="intro">'+esc(profile.bio)+'</p><div class="meta"><div><small>Doğum tarihi</small><strong>'+esc(profile.born)+'</strong></div><div><small>Doğum yeri</small><strong>'+esc(profile.place)+'</strong></div><div><small>Uyruk</small><strong>'+esc(driver.nationality)+'</strong></div><div><small>Formula 1 debutu</small><strong>'+esc(profile.debut)+'</strong></div><div><small>Yarış numarası</small><strong>'+(profile.number||'—')+'</strong></div><div><small>2026 takımı</small><strong>'+esc(driver.team)+'</strong></div></div></div></section><section class="stats"><div class="stat"><small>2026 pilotlar sıralaması</small><strong>#'+driver.position+'</strong></div><div class="stat"><small>2026 puanı</small><strong>'+driver.points+'</strong></div><div class="stat"><small>Takım sıralaması</small><strong>'+(team?'#'+team.position:'—')+'</strong></div></section><section class="columns"><article class="card"><h2>Kariyer biyografisi</h2><p class="bio">'+esc(profile.bio)+'</p><div class="style-note"><strong>Sürüş karakteri</strong><br>'+esc(profile.style)+'</div></article><article class="card"><h2>Kariyerinin önemli anları</h2><ol class="timeline">'+profile.milestones.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></article></section><section class="other"><div class="eyebrow">THE GRID / 2026</div><h2>Diğer pilotlar</h2><div class="other-list">'+season.drivers.filter(d=>d.name!==driver.name).map(d=>'<a href="driver.html?driver='+slug(d.name)+'">'+esc(d.name)+' <span style="color:var(--muted)">↗</span></a>').join('')+'</div></section><p class="source">2026 sıra ve puan bilgileri APEX F1 sezon kaydından alınmıştır. Biyografik bilgiler için <a href="https://www.formula1.com/en/drivers" target="_blank" rel="noopener">Formula 1 pilot profilleri</a> ve <a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(profile.wiki)+'" target="_blank" rel="noopener">Wikipedia</a> referans alınmıştır. Fotoğraf kaynağı: Wikimedia Foundation / ilgili biyografi sayfası.</p>';
  loadPhoto(profile,driver.name);
 }catch(e){showError()}
}
function loadPhoto(profile,name){
 const img=document.getElementById('driverPhoto'),credit=document.getElementById('photoCredit');
 const url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(profile.wiki);
 fetch(url,{headers:{'Accept':'application/json'}}).then(r=>{if(!r.ok)throw Error('photo unavailable');return r.json()}).then(data=>{
  const photo=data.originalimage?.source||data.thumbnail?.source;
  if(!photo)throw Error('no portrait');
  img.onload=()=>{img.classList.add('loaded');credit.textContent='Fotoğraf: Wikimedia Commons / Wikipedia';};
  img.onerror=()=>{credit.textContent='Portre fotoğrafı şu anda yüklenemiyor';};
  img.src=photo;
 }).catch(()=>{credit.textContent='Portre fotoğrafı şu anda yüklenemiyor';});
}
load();
</script></body></html>
