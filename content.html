function renderPhoto(p){document.title=p.title+' | APEX F1';$('main')?.remove();const main=document.createElement('main');main.className='wrap article';main.innerHTML='<div class="eyebrow">APEX F1 / VISUAL PADDOCK</div><h1>'+esc(p.title)+'</h1><p class="dek">'+esc(p.dek)+'</p><img class="hero-image" src="'+esc(p.image)+'" alt="'+esc(p.alt)+'"><div class="caption">'+esc(p.event)+' · Görsel: '+esc(p.source)+'</div><p class="body-copy">Bu fotoğraf, ilgili yayıncının Formula 1 kapsamından seçilmiştir. Görselin hakları ve editoryal bağlamı kaynak yayıncıya aittir. APEX F1 görseli kaynak göstererek sunar; orijinal yayın ve daha fazla fotoğraf için aşağıdaki kaynağı ziyaret edebilirsiniz.</p><aside class="source-box"><small>İÇERİK KAYNAĞI / PHOTO CREDIT</small><strong>'+esc(p.source)+'</strong><p>Görsel ve editoryal içerik için orijinal yayın.</p><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">Kaynak yayını aç ↗</a></aside>';document.querySelector('header').after(main)}
