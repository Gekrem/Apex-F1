size:9px;letter-spacing:1px;text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 36px}.stat{background:linear-gradient(145deg,#102017,#0b130e);border:1px solid var(--line);padding:20px}.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}.stat strong{display:block;font-size:34px;line-height:1.15;color:var(--bright);margin-top:5px}.stat em{font-style:normal;font-size:10px;color:var(--muted)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:rgba(13,23,17,.82);border:1px solid var(--line);padding:24px}.card h2{font-size:24px;line-height:1.2;margin:0 0 18px}.timeline{list-style:none;padding:0;margin:0;counter-reset:item}.timeline li{position:relative;padding:0 0 18px 30px;border-left:1px solid #31533e;margin-left:7px;color:#c8d5cc}.timeline li:before{counter-increment:item;content:counter(item,decimal-leading-zero);position:absolute;left:-8px;top:0;background:#10271a;color:var(--bright);font-size:9px;font-weight:900;padding:2px}.timeline li:last-child{border-left-color:transparent;padding-bottom:0}.drivers{margin-top:28px}.driver-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.driver{border:1px solid var(--line);background:#0c1510;padding:13px 15px;text-decoration:none;transition:border-color .2s,transform .2s}.driver:hover{border-color:var(--green);transform:translateY(-2px)}.driver small{display:block;color:var(--muted);font-size:9px}.driver strong{font-size:16px}.driver span{float:right;color:var(--bright);font-size:10px}.source{border-top:1px solid var(--line);margin-top:32px;padding-top:16px;color:var(--muted);font-size:10px}.source a{color:var(--bright)}.error{padding:60px 0}.error h1{font-size:42px}@media(max-width:760px){.hero{grid-template-columns:1fr;gap:18px}.crest{height:220px}.stats{grid-template-columns:1fr}.columns{grid-template-columns:1fr}.driver-grid{grid-template-columns:1fr 1fr}.identity h1{font-size:48px}} <script>
const TEAMS={"mercedes":{"name":"Mercedes","wiki":"Mercedes-Benz_in_Formula_One","base":"Brackley, Birleşik Krallık","founded":"2010 (modern fabrika takımı)","titles":9,"years":"2014–2021, 2026","bio":"Mercedes'in modern fabrika takımı 2010'da Formula 1'e döndü. 2014'te başlayan turbo-hibrit dönemde güç ünitesi, aerodinami ve takım operasyonlarıyla uzun süre gridin referans noktası oldu.","moments":["2014: Turbo-hibrit dönemin ilk sezonunda takımlar şampiyonluğunu kazandı.","2016: Nico Rosberg ve Lewis Hamilton arasındaki mücadele sezona damga vurdu.","2020: Üst üste yedinci takımlar şampiyonluğunu aldı.","2026: São Paulo GP'de takımlar şampiyonluğunu yeniden garantiledi."],"legends":["Lewis Hamilton","Nico Rosberg","Valtteri Bottas","Michael Schumacher","George Russell"],"accent":"#00d2be"},"ferrari":{"name":"Ferrari","wiki":"Scuderia_Ferrari","base":"Maranello, İtalya","founded":"1950","titles":16,"years":"1961, 1964, 1975–1977, 1979, 1982–1983, 1999–2004, 2007–2008","bio":"Scuderia Ferrari, Formula 1'in 1950'deki ilk sezonundan bu yana şampiyonada yer alan en köklü takımdır. Maranello merkezli ekip, yarış kültürü ve kırmızı otomobilleriyle sporun en güçlü sembollerinden biridir.","moments":["1951: José Froilán González, Ferrari'ye ilk F1 yarış galibiyetini getirdi.","1975–1977: Niki Lauda liderliğinde iki takımlar şampiyonluğu kazandı.","2000–2004: Michael Schumacher ile beş yıl üst üste pilotlar şampiyonluğu ve altı yıl üst üste takımlar şampiyonluğu dönemi yaşandı.","2007–2008: Kimi Räikkönen pilotlar, Ferrari takımlar şampiyonluğunu kazandı."],"legends":["Michael Schumacher","Niki Lauda","Kimi Räikkönen","Alain Prost","Fernando Alonso","Sebastian Vettel"],"accent":"#e10600"},"red-bull-racing":{"name":"Red Bull Racing","wiki":"Red_Bull_Racing","base":"Milton Keynes, Birleşik Krallık","founded":"2005","titles":6,"years":"2010–2013, 2022–2023","bio":"Red Bull Racing, 2005'te Jaguar takımının devralınmasıyla Formula 1'e katıldı. Güçlü aerodinamik paketleri ve iddialı yarış yaklaşımıyla kısa sürede şampiyonluk mücadelesinin kalıcı aktörlerinden oldu.","moments":["2009: Çin GP'de takımın ilk Formula 1 galibiyeti geldi.","2010–2013: Sebastian Vettel ile arka arkaya dört takımlar ve pilotlar şampiyonluğu kazandı.","2021: Max Verstappen ilk pilotlar şampiyonluğunu elde etti.","2022–2023: İki sezon üst üste takımlar şampiyonu oldu."],"legends":["Sebastian Vettel","Max Verstappen","Daniel Ricciardo","Mark Webber","Sergio Pérez"],"accent":"#2445a5"},"mclaren":{"name":"McLaren","wiki":"McLaren","base":"Woking, Birleşik Krallık","founded":"1963 (F1 debutu 1966)","titles":10,"years":"1974, 1984–1985, 1988–1991, 1998, 2024–2025","bio":"Bruce McLaren'ın 1963'te kurduğu takım, 1966'da Formula 1'e adım attı. Yenilikçi mühendisliği ve efsanevi pilotlarıyla sporun en başarılı ekiplerinden biridir.","moments":["1974: Emerson Fittipaldi ile ilk takımlar şampiyonluğunu kazandı.","1988: Senna ve Prost'lu kadro 16 yarışın 15'ini kazandı.","1998: Mika Häkkinen ve David Coulthard ile şampiyon oldu.","2024 ve 2025: Üst üste iki takımlar şampiyonluğu kazandı."],"legends":["Ayrton Senna","Alain Prost","Mika Häkkinen","Lewis Hamilton","Emerson Fittipaldi","Lando Norris"],"accent":"#ff8700"},"racing-bulls":{"name":"Racing Bulls","wiki":"Racing_Bulls","base":"Faenza, İtalya / Milton Keynes, Birleşik Krallık","founded":"2006 (Toro Rosso adıyla)","titles":0,"years":"Takımlar şampiyonluğu yok","bio":"Racing Bulls, Red Bull'un ikinci takımı olarak 2006'da Scuderia Toro Rosso adıyla yarışmaya başladı. Genç pilotları geliştirme rolüyle tanınır; 2025'te Racing Bulls adını aldı.","moments":["2008: Sebastian Vettel, İtalya GP'yi kazanarak takımın ilk zaferini elde etti.","2019: Pierre Gasly, Brezilya GP'de ikinci oldu.","2020: Gasly, AlphaTauri adıyla Monza'da İtalya GP'yi kazandı.","2025: Takım Racing Bulls kimliğiyle yeni dönemine başladı."],"legends":["Sebastian Vettel","Pierre Gasly","Daniel Ricciardo","Carlos Sainz","Max Verstappen","Yuki Tsunoda"],"accent":"#2447a8"},"alpine":{"name":"Alpine","wiki":"Alpine_F1_Team","base":"Enstone, Birleşik Krallık","founded":"2021 (Renault takım kimliğinin devamı)","titles":2,"years":"Renault dönemi: 2005–2006","bio":"Alpine, Renault'nun Enstone merkezli Formula 1 takımının 2021'deki marka dönüşümüdür. İki takımlar şampiyonluğu bugünkü Alpine adıyla değil, Renault adıyla 2005 ve 2006'da kazanılmıştır.","moments":["2005: Fernando Alonso ile Renault takımlar şampiyonu oldu.","2006: Renault ve Alonso şampiyonluklarını savundu.","2021: Esteban Ocon, Macaristan GP'yi kazanarak Alpine markasına ilk zaferini getirdi.","2022: Alonso ve Ocon ile güçlü puan sezonu geçirdi."],"legends":["Fernando Alonso","Giancarlo Fisichella","Esteban Ocon","Daniel Ricciardo","Pierre Gasly"],"accent":"#0090ff"},"haas-f1-team":{"name":"Haas F1 Team","wiki":"Haas_F1_Team","base":"Kannapolis, ABD / Banbury, Birleşik Krallık","founded":"2016","titles":0,"years":"Takımlar şampiyonluğu yok","bio":"Gene Haas tarafından kurulan Haas, 2016'da Formula 1'e katıldı. Ferrari ile teknik iş birliği ve verimli operasyon modeliyle küçük ölçekli bir takım olarak gridde yer edindi.","moments":["2016: İlk sezonunda puanlar alarak Formula 1'e güçlü giriş yaptı.","2018: Takımlar şampiyonasını beşinci sırada tamamladı; tarihinin en iyi derecesi.","2022: Kevin Magnussen, Bahreyn GP sıralamasında beşinci oldu.","2024: Sezonun ikinci yarısında güçlü puan serisi yakaladı."],"legends":["Romain Grosjean","Kevin Magnussen","Nico Hülkenberg","Esteban Ocon"],"accent":"#d71920"},"audi":{"name":"Audi","wiki":"Audi_F1_Team","base":"Hinwil, İsviçre / Neuburg, Almanya","founded":"2026 (Sauber takımının dönüşümü)","titles":0,"years":"Audi adıyla takımlar şampiyonluğu yok","bio":"Audi, Sauber'in Formula 1 altyapısını devralarak 2026'da fabrika takımı kimliğiyle şampiyonaya katıldı. Proje, kendi güç ünitesi ve uzun vadeli fabrika yapılanması üzerine kuruldu.","moments":["1993: Audi projesinin takım altyapısının kökü olan Sauber Formula 1'e girdi.","2001: Sauber takımlar şampiyonasını dördüncü sırada bitirdi.","2024: Audi, Sauber'i devralma hazırlıklarını hızlandırdı.","2026: Audi adıyla ilk Formula 1 sezonu başladı."],"legends":["Kimi Räikkönen","Nick Heidfeld","Robert Kubica","Nico Hülkenberg","Gabriel Bortoleto"],"accent":"#d71920"},"williams":{"name":"Williams","wiki":"Williams_Grand_Prix_Engineering","base":"Grove, Birleşik Krallık","founded":"1977 (F1 debutu 1978)","titles":9,"years":"1980–1981, 1986–1987, 1992–1994, 1996–1997","bio":"Frank Williams ve Patrick Head'in kurduğu Williams, 1980'ler ve 1990'larda Formula 1'in teknik ve sportif güç merkezlerinden biriydi. Dokuz takımlar şampiyonluğu kazandı.","moments":["1980: Alan Jones ile ilk takımlar şampiyonluğunu kazandı.","1992: Nigel Mansell'in baskın sezonuyla zirveye çıktı.","1996–1997: Damon Hill ve Jacques Villeneuve ile arka arkaya şampiyon oldu.","2012: Pastor Maldonado, İspanya GP'yi kazanarak takımın son yarış zaferini aldı."],"legends":["Nigel Mansell","Ayrton Senna","Alain Prost","Damon Hill","Jacques Villeneuve","Juan Pablo Montoya"],"accent":"#005aff"},"aston-martin":{"name":"Aston Martin","wiki":"Aston_Martin_in_Formula_One","base":"Silverstone, Birleşik Krallık","founded":"2021 (Aston Martin adıyla dönüş)","titles":0,"years":"Takımlar şampiyonluğu yok","bio":"Aston Martin, 2021'de Racing Point'in marka dönüşümüyle Formula 1'e geri döndü. Silverstone merkezli takım, büyük yatırım ve fabrika altyapısı hedefiyle şampiyonluk mücadelesine yaklaşmayı amaçlıyor.","moments":["2021: Aston Martin adıyla Formula 1'e döndü.","2023: Fernando Alonso ile sezonun ilk bölümünde art arda podyumlar elde etti.","2023: Takımlar şampiyonasını beşinci sırada tamamladı.","2026: Yeni teknik düzenlemeler döneminde altyapısını geliştirmeyi sürdürdü."],"legends":["Fernando Alonso","Sebastian Vettel","Lance Stroll","Sergio Pérez","Jenson Button"],"accent":"#00665e"},"cadillac":{"name":"Cadillac","wiki":"Cadillac_Formula_One_Team","base":"ABD / Silverstone, Birleşik Krallık","founded":"2026","titles":0,"years":"Takımlar şampiyonluğu yok","bio":"Cadillac, General Motors desteğiyle 2026'da Formula 1 gridine katılan Amerikan takımıdır. Proje, ABD merkezli otomotiv ve motor sporları birikimini Formula 1'in küresel sahnesine taşımayı hedefler.","moments":["2023: Andretti-Cadillac projesi katılım hedefini duyurdu.","2024: General Motors'un fabrika güç ünitesi planı açıklandı.","2025: Cadillac'ın 2026 gridine katılımı resmileşti.","2026: Cadillac ilk Formula 1 sezonuna başladı."],"legends":["Sergio Pérez","Valtteri Bottas"],"accent":"#c6d0d7"}},ALIASES={"mercedes":["Mercedes"],"ferrari":["Ferrari"],"red-bull-racing":["Red Bull Racing","Red Bull"],"mclaren":["McLaren"],"racing-bulls":["Racing Bulls","RB F1 Team","RB"],"alpine":["Alpine","Alpine F1 Team"],"haas-f1-team":["Haas F1 Team"],"audi":["Audi"],"williams":["Williams"],"aston-martin":["Aston Martin"],"cadillac":["Cadillac","Cadillac F1 Team"]};const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const requestedRaw=new URLSearchParams(location.search).get('team')||'';const requestedId=String(requestedRaw).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const ID_ALIASES={'rb-f1-team':'racing-bulls','rb':'racing-bulls','red-bull':'red-bull-racing','alpine-f1-team':'alpine','renault':'alpine','haas':'haas-f1-team','cadillac-f1-team':'cadillac'};const id=ID_ALIASES[requestedId]||requestedId;const app=document.getElementById('app');
function error(){app.innerHTML='<div class="error"><div class="eyebrow">THE PADDOCK / TEAM PROFILE</div><h1>Takım bulunamadı</h1><p>Bağlantı geçersiz. Takımlar sıralamasına dönüp yeniden deneyebilirsin.</p><a class="back" href="index.html#standings">← Takımlara dön</a></div>'}
async function load(){try{const r=await fetch('data/season-2026.json',{cache:'no-store'});if(!r.ok)throw Error();const season=await r.json(),t=TEAMS[id];if(!t){error();return}const aliases=ALIASES[id]||[];const roster=season.drivers.filter(d=>aliases.some(n=>n.toLowerCase()===d.team.toLowerCase()));const standing=season.teams.find(x=>slug(x.name)===id)||season.teams.find(x=>aliases.includes(x.name));document.title=t.name+' | Takım Profili — APEX F1';document.documentElement.style.setProperty('--team-accent',t.accent);app.innerHTML='<div class="eyebrow">THE PADDOCK / TEAM PROFILE · 2026 SEASON</div><section class="hero"><div class="crest"><div class="fallback">'+esc(t.name)+'</div><img id="teamLogo" alt="'+esc(t.name)+' logosu"></div><div class="identity"><span class="tag">FORMULA 1 CONSTRUCTOR</span><h1>'+esc(t.name)+'</h1><div class="base">'+esc(t.base)+'</div><p class="bio">'+esc(t.bio)+'</p></div></section><section class="stats"><div class="stat"><small>Takımlar dünya şampiyonluğu</small><strong>'+t.titles+'</strong><em>'+esc(t.years)+'</em></div><div class="stat"><small>2026 takımlar sıralaması</small><strong>'+(standing?'#'+standing.position:'—')+'</strong><em>'+(standing?standing.points+' puan':'Sezon kaydı bulunamadı')+'</em></div><div class="stat"><small>Formula 1 başlangıcı</small><strong style="font-size:25px">'+esc(t.founded)+'</strong><em>Takım tarihçesi</em></div></section><section class="columns"><article class="card"><h2>Takımın biyografisi</h2><p style="color:#c4d3c8;line-height:1.85">'+esc(t.bio)+'</p><p style="color:var(--muted);font-size:11px">Alpine için belirtilen iki takımlar şampiyonluğu Renault dönemine aittir. Diğer sayılar takım/marka tarihçesi esas alınarak verilmiştir.</p></article><article class="card"><h2>İkonik anlar</h2><ol class="timeline">'+t.moments.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></article></section><section class="drivers"><div class="eyebrow">LEGACY / LEGENDARY DRIVERS</div><h2 style="font-size:27px;margin:4px 0 14px">İkonik pilotlar</h2><div class="driver-grid">'+t.legends.map((n,i)=>'<a class="driver" href="https://en.wikipedia.org/wiki/'+encodeURIComponent(n.replace(/ /g,'_'))+'" target="_blank" rel="noopener"><small>LEGACY DRIVER · '+String(i+1).padStart(2,'0')+'</small><strong>'+esc(n)+'</strong><span>↗</span></a>').join('')+'</div><p style="font-size:10px;color:var(--muted);margin-top:10px">Pilotlar takım tarihinin farklı dönemlerinden seçilmiştir; hepsi aynı anda takımda yarışmamıştır.</p><h2 style="font-size:23px;margin:28px 0 12px">2026 pilot kadrosu</h2><div class="driver-grid">'+(roster.length?roster.map(d=>'<a class="driver" href="driver.html?driver='+slug(d.name)+'"><small>2026 · '+d.points+' PTS</small><strong>'+esc(d.name)+'</strong><span>↗</span></a>').join(''):'<p style="color:var(--muted)">2026 sezon verisinde bu takımla eşleşen pilot bulunamadı.</p>')+'</div></section><p class="source">Tarihçe ve şampiyonluk referansları: <a href="https://www.formula1.com/en/latest/article/the-75-best-drivers-cars-innovations-teams-and-key-figures-in-f1-history.6VcYXd7l9aI6fysNWtxFja.html" target="_blank" rel="noopener">Formula 1 — F1 tarihindeki önemli takımlar</a> · <a href="https://www.reuters.com/sports/formula1/list-formula-one-constructors-champions-2026-11-08/" target="_blank" rel="noopener">Reuters — Takımlar şampiyonları</a>. 2026 puanı APEX F1 sezon kaydından alınmıştır. Logo görseli Wikipedia/Wikimedia Commons arşivinden yüklenir.</p>';loadLogo(t)}catch(e){error()}}
function loadLogo(t){const img=document.getElementById('teamLogo');fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t.wiki),{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const src=d.originalimage?.source||d.thumbnail?.source;if(!src)throw Error();img.onload=()=>img.classList.add('loaded');img.src=src}).catch(()=>{})}load();
</script></body></html>
