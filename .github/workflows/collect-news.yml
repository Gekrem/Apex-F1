name: Collect F1 news drafts

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/collect_news.py'
      - '.github/workflows/collect-news.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect RSS headlines as drafts
        run: python scripts/collect_news.py

      - name: Open or update editorial review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/f1-news-drafts
          delete-branch: true
          title: 'APEX F1: Review new news drafts'
          commit-message: 'Add collected F1 news drafts'
          body: |
            Verify stories against original sources.
            Add Turkish translations.
            Publish only editor-approved stories.
          labels: news, editorial-review
