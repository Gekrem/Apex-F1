name: Validate APEX F1 news

on:
  pull_request:
    paths:
      - 'data/news.json'
      - 'scripts/validate_news.py'
      - '.github/workflows/validate-news.yml'
  push:
    branches:
      - main
    paths:
      - 'data/news.json'
      - 'scripts/validate_news.py'
      - '.github/workflows/validate-news.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JSON and editorial requirements
        run: python scripts/validate_news.py
