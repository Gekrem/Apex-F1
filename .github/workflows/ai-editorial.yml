name: APEX F1 AI editorial drafts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/news.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apex-f1-ai-editorial
  cancel-in-progress: false

jobs:
  prepare-bilingual-drafts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Prepare Turkish and English editorial drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
          AI_MAX_ITEMS: "15"
        run: python scripts/ai_editorial.py

      - name: Open or update human-review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ai-editorial-drafts
          delete-branch: true
          title: "APEX F1: AI bilingual editorial drafts for review"
          commit-message: "Prepare bilingual AI editorial drafts"
          body: |
            AI-assisted Turkish and English headlines and summaries are ready for editorial review.

            - Check every item against its linked original source.
            - Review the AI editorial notes.
            - Correct names, dates, numbers and context.
            - Keep every item as draft until a human editor approves it.

            AI-generated copy is never published automatically.
